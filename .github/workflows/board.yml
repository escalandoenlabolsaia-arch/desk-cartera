name: board

on:
  workflow_dispatch:          # botón manual: "deliberá ahora"
  schedule:
    - cron: "0 12 * * 1"      # lunes 12:00 UTC (09:00 AR) — inicio de semana

permissions:
  contents: write

jobs:
  deliberar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Deliberar board
        env:
          SHEET_ID_NIETO: ${{ secrets.SHEET_ID_NIETO }}
          GSA_JSON_NIETO: ${{ secrets.GSA_JSON_NIETO }}
          NTFY_TOPIC_NIETO: ${{ secrets.NTFY_TOPIC_NIETO }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Guardar registro
        run: |
          git config user.name "board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ultima_deliberacion.json 2>/dev/null || true
          git add salidas/estado.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "board: registro [skip ci]"
          git push || echo "sin cambios"
